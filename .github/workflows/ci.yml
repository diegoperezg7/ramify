name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  # The release runs this whole workflow first and builds nothing unless it passes.
  workflow_call:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -S warning ramify install.sh tests/run.sh tests/git-guard.sh examples/*/*.sh scripts/*.sh
      - name: tests
        run: bash tests/run.sh
      - name: one version everywhere (and the tag's, for a release)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ./scripts/check-version.sh "$GITHUB_REF_NAME"; else ./scripts/check-version.sh; fi

  # macOS is the main platform (bash 3.2): the CLI suite runs there on every push and pull request.
  cli-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: tests
        run: bash tests/run.sh

  apps:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: core tests
        run: npm run test:core
      - name: typecheck
        run: npm run typecheck
      - name: web build is up to date
        run: npm run build:web && git diff --stat --exit-code -- ui/dist
      - name: Claude Code plugin is in sync
        run: ./scripts/sync-plugin.sh && git diff --stat --exit-code -- claude-plugin
      - name: VS Code extension packages
        run: npm run package -w apps/vscode
      - name: UI end-to-end
        run: npx playwright install --with-deps chromium && npm run test:e2e -w packages/core

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: the shared branch guarded by git itself (ramify install guard, under Git Bash)
        shell: bash
        run: bash tests/git-guard.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: core tests (engine through Git Bash, session detection)
        run: npm run test:core
      - name: session scan on a real Windows machine
        run: node -e "import('./packages/core/src/activity.ts').then(async (m) => { const s = await m.scanSessions(process.env); console.log(JSON.stringify(s, null, 2)) })"
      - name: installer builds
        run: node node_modules/electron/install.js && npm run build:web && npm run dist:win -w apps/desktop
      - name: the packaged app renders
        run: npm run smoke -w apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ramify-windows
          path: apps/desktop/release/*.exe
