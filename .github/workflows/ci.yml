name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -S warning ramify install.sh tests/run.sh examples/*/*.sh scripts/*.sh
      - name: tests
        run: bash tests/run.sh

  # macOS runners can wait in the queue long enough to be cancelled, failing every push: the CLI suite runs on macOS
  # for release tags and on demand (gh workflow run ci).
  cli-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: tests
        run: bash tests/run.sh

  apps:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: core tests
        run: npm run test:core
      # TEMPORARY, branch fix/port-lock only: evidence for the port lock fix on this runner. Remove before merging.
      - name: port lock under load (temporary)
        run: |
          export GIT_AUTHOR_NAME=t GIT_AUTHOR_EMAIL=t@t GIT_COMMITTER_NAME=t GIT_COMMITTER_EMAIL=t@t NO_COLOR=1
          mkdir --version | head -1
          d=$(mktemp -d); multi=0
          for r in $(seq 300); do
            rm -rf "$d/l" "$d/ok"; mkdir -p "$d/ok"
            for k in 1 2 3 4; do (mkdir "$d/l" 2>/dev/null && : > "$d/ok/$k") & done; wait
            [ "$(ls "$d/ok" | wc -l)" -le 1 ] || multi=$((multi + 1))
          done
          echo "plain mkdir, 4 at once: rounds with more than one owner: $multi/300"
          git fetch -q --depth=1 origin main && git show FETCH_HEAD:ramify > "$d/ramify-main"
          # main with only the grep fix (7b9d467): main's file with this branch's alloc_port in place of its own, so its
          # duplicates can only come from two holders of the mkdir lock.
          awk 'NR == FNR { if (index($0, "alloc_port() {") == 1) f = 1; if (f) fn = fn $0 "\n"; if (f && $0 == "}") f = 0; next }
               index($0, "alloc_port() {") == 1 { printf "%s", fn; skip = 1; next }
               skip { if ($0 == "}") skip = 0; next }
               { print }' ramify "$d/ramify-main" > "$d/ramify-main-grepfix"
          echo "main with only the grep fix, lines changed from main: $(diff "$d/ramify-main" "$d/ramify-main-grepfix" | grep -c '^[<>]')"
          race() {  # four ramify new at once, $2 rounds: how many rounds hand out one port twice (each one listed)
            local bin=$1 n=$2 dups=0 i r b ports
            for i in $(seq "$n"); do
              r="$d/race/r$i"; mkdir -p "$r"; git -C "$r" init -q -b main; git -C "$r" commit -q --allow-empty -m init
              for b in p1 p2 p3 p4; do (cd "$r" && RAMIFY_ROOT="$d/race/root$i" bash "$bin" new "$b" --no-launch >/dev/null 2>&1) & done; wait
              ports=$(for b in p1 p2 p3 p4; do sed -n 's/^PORT=//p' "$d/race/root$i/r$i/$b/.worktree.env" 2>/dev/null || echo missing; done | tr '\n' ' ')
              # shellcheck disable=SC2086
              if [ "$(printf '%s\n' $ports | sort -u | wc -l)" -ne 4 ]; then dups=$((dups + 1)); echo "  $(basename "$bin") round $i: $ports" >&2; fi
            done
            rm -rf "$d/race"; echo "$dups"
          }
          echo "ramify of main: rounds with a port twice: $(race "$d/ramify-main" 150)/150"
          echo "ramify of main with only the grep fix: rounds with a port twice: $(race "$d/ramify-main-grepfix" 150)/150"
          branch=$(race "$PWD/ramify" 150)
          echo "ramify of this branch: rounds with a port twice: $branch/150"
          cd packages/core; fails=0
          for i in $(seq 10); do
            npm test > "$d/out.txt" 2>&1 || { fails=$((fails + 1)); echo "core suite run $i failed:"; grep -E '^✖ |AssertionError' "$d/out.txt" | head -8; }
          done
          echo "core suite: $fails/10 runs failed"
          [ "$fails" -eq 0 ] && [ "$branch" -eq 0 ]
      - name: typecheck
        run: npm run typecheck
      - name: web build is up to date
        run: npm run build:web && git diff --stat --exit-code -- ui/dist
      - name: Claude Code plugin is in sync
        run: ./scripts/sync-plugin.sh && git diff --stat --exit-code -- claude-plugin
      - name: VS Code extension packages
        run: npm run package -w apps/vscode
      - name: UI end-to-end
        run: npx playwright install --with-deps chromium && npm run test:e2e -w packages/core

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: core tests (engine through Git Bash, session detection)
        run: npm run test:core
      - name: session scan on a real Windows machine
        run: node -e "import('./packages/core/src/activity.ts').then(async (m) => { const s = await m.scanSessions(process.env); console.log(JSON.stringify(s, null, 2)) })"
      - name: installer builds
        run: node node_modules/electron/install.js && npm run build:web && npm run dist:win -w apps/desktop
      - name: the packaged app renders
        run: npm run smoke -w apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ramify-windows
          path: apps/desktop/release/*.exe
