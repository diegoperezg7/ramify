name: ci
on: [push, pull_request]

jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning agent-wt install.sh tests/run.sh examples/*/*.sh scripts/*.sh
      - name: tests
        run: bash tests/run.sh

  apps:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: core tests
        run: npm run test:core
      - name: typecheck
        run: npm run typecheck
      - name: web build is up to date
        run: npm run build:web && git diff --stat --exit-code -- ui/dist
      - name: Claude Code plugin is in sync
        run: ./scripts/sync-plugin.sh && git diff --stat --exit-code -- claude-plugin
      - name: VS Code extension packages
        run: npm run package -w apps/vscode
      - name: UI end-to-end
        run: npx playwright install --with-deps chromium && npm run test:e2e -w packages/core
