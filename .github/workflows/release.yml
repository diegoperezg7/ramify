name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist
            files: apps/desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            files: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build:web
      - run: npm run ${{ matrix.script }} -w apps/desktop
        env:
          # Signing and notarization happen only when these secrets exist; without them the build is unsigned.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || secrets.WIN_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: the packaged app renders
        run: npm run smoke -w apps/desktop
      - name: VS Code extension
        if: runner.os == 'macOS'
        run: npm run package -w apps/vscode && cp apps/vscode/ramify.vsix "apps/desktop/release/ramify-${GITHUB_REF_NAME#v}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            ${{ matrix.files }}
            apps/desktop/release/*.vsix

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Ramify ${GITHUB_REF_NAME#v}" --notes "Downloads:

          - **macOS**: \`.dmg\` for Apple silicon (M1 or later), signed with a Developer ID and notarized.
          - **Windows**: \`.exe\` installer (x64; runs on Windows on ARM too). Needs [Git for Windows](https://git-scm.com/download/win). SmartScreen may warn because it is not signed: *More info* → *Run anyway*.
          - **VS Code / Cursor**: \`.vsix\` (\`code --install-extension ramify-*.vsix\`).
          - **CLI**: \`git clone\` and \`./install.sh\`, see the README."
